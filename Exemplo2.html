<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo2 Tabelas</title>
</head>
<body>
    <header>
        <h1 style="text-align: center; color:brown">Almoço Do SESI </h1>
        <hr>

    </header>
    <main>
        <!--Iciando tabela-->
        <table border="1" style="width: 100%;">
            <!--Título da tabela-->
            <caption>Comidas do SESI</caption>
            <!--Cabeçalho do tabela-->
            <thead>
            <!--Primeira linha do Cabeçalho-->
                <tr>
                    <th colspan="6">Dias Da Semana</th>
                </tr>
            <!--Primeira linha da tabela-->
                <tr>
                    <th>Informações</th>
                    <th>Segunda</th>
                    <th>Terça</th>
                    <th>Quarta</th>
                    <th>Quinta</th>
                    <th>Sexta</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td rowspan="2" style="text-align: center;" style="background-image: url('https://i.pinimg.com/736x/ba/d7/5d/bad75d4cea3ddb4c0da618f1598fdb5c.jpg');"> Informações Nutricionais</td>
                    <td colspan="6" style="text-align: center;"><b>Arroz + Feijão</b></td>
                    
                </tr>
                <tr>
                    <!--Segunda linha da tabela-->

                    <th>Frango Grelhado</th>
                    <th>Carne De Panela</th>
                    <th>Omelete</th>
                    <th>Frango Ao Molho Ferrugem</th>
                    <th>Carne Moída</th>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
